
name: Build JJ Studio X APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'JJStudioX_MODERN_TRACKING_ANDROID.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract ZIP
        run: |
          mkdir project
          unzip -q JJStudioX_MODERN_TRACKING_ANDROID.zip -d project
          test -f project/settings.gradle

      - name: Build APK
        working-directory: project
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JJStudioX-debug-APK
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
